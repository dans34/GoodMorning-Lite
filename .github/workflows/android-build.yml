name: Android debug build and UI smoke test

# Keep emulator runs serial while we diagnose each build/test result.
concurrency:
  group: goodmorning-lite-emulator-tests
  cancel-in-progress: false

# Paused during investigation. Runs only when manually started.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Launch app and run UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          script: |
            mkdir -p screenshots
            adb wait-for-device
            adb devices -l > screenshots/adb-devices.txt 2>&1 || true

            # Poll boot state; do not stop before diagnostics can be collected.
            boot_state=""
            for attempt in $(seq 1 24); do
              boot_state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              if [ "$boot_state" = "1" ]; then
                break
              fi
              sleep 5
            done
            printf 'sys.boot_completed=%s\n' "$boot_state" > screenshots/boot-state.txt

            adb shell input keyevent 82 || true
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            # Install before clearing data. Keep going after failures so diagnostics survive.
            adb install -r app/build/outputs/apk/debug/app-debug.apk > screenshots/install-output.txt 2>&1 || echo "FAIL: APK installation failed." > screenshots/smoke-test-result.txt
            adb shell pm clear com.dans34.goodmorninglite > screenshots/pm-clear-output.txt 2>&1 || true
            adb shell am force-stop com.dans34.goodmorninglite > screenshots/force-stop-output.txt 2>&1 || true
            adb shell am start -W -n com.dans34.goodmorninglite/.MainActivity > screenshots/launch-output.txt 2>&1 || echo "FAIL: Activity launch failed." > screenshots/smoke-test-result.txt
            sleep 5

            # Best-effort diagnostics run even when install or launch fails.
            adb shell uiautomator dump /sdcard/window.xml > screenshots/uiautomator-output.txt 2>&1 || true
            adb pull /sdcard/window.xml screenshots/window.xml > screenshots/adb-pull-output.txt 2>&1 || true
            adb exec-out screencap -p > screenshots/goodmorning-lite-first-launch.png 2> screenshots/screencap-error.txt || true
            adb logcat -b all -d > screenshots/android-logcat-full.txt 2>&1 || true
            adb shell dumpsys activity processes > screenshots/activity-processes.txt 2>&1 || true
            adb shell dumpsys meminfo > screenshots/memory-dump.txt 2>&1 || true
            adb shell dumpsys activity lastanr > screenshots/last-anr.txt 2>&1 || true
            adb shell dumpsys window windows > screenshots/window-dump.txt 2>&1 || true
            adb shell getprop sys.boot_completed > screenshots/boot-state-final.txt 2>&1 || true

            if [ "$boot_state" != "1" ]; then
              echo "FAIL: Android boot flag was not 1." > screenshots/smoke-test-result.txt
            elif ! grep -qE 'Which routine should we build first\\?|GoodMorning' screenshots/window.xml 2>/dev/null; then
              echo "FAIL: Expected onboarding/home UI was not found." > screenshots/smoke-test-result.txt
            elif grep -Eqi 'Process system isn.t responding|System UI isn.t responding|FATAL EXCEPTION.*com\\.dans34\\.goodmorninglite' screenshots/window.xml screenshots/android-logcat-full.txt 2>/dev/null; then
              echo "FAIL: ANR dialog or app fatal exception detected." > screenshots/smoke-test-result.txt
            elif [ ! -s screenshots/goodmorning-lite-first-launch.png ]; then
              echo "FAIL: Screenshot was not captured." > screenshots/smoke-test-result.txt
            else
              echo "PASS: app launched and expected first screen is visible." > screenshots/smoke-test-result.txt
            fi

            cat screenshots/smoke-test-result.txt
            grep -q '^PASS:' screenshots/smoke-test-result.txt

      - name: Upload emulator diagnostics and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-emulator-diagnostics
          path: screenshots/
          if-no-files-found: warn
