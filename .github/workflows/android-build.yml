name: Android debug build and screenshot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Launch app in Android emulator and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.dans34.goodmorninglite
            adb shell am start -n com.dans34.goodmorninglite/.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshots/goodmorning-lite-first-launch.png
            test -s screenshots/goodmorning-lite-first-launch.png

      - name: Upload real emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-emulator-screenshot
          path: screenshots/goodmorning-lite-first-launch.png
          if-no-files-found: error
