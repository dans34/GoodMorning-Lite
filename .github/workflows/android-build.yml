name: Android debug build and screenshot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Launch app and collect emulator diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            mkdir -p screenshots
            echo "=== Emulator properties ===" > screenshots/android-anr-diagnostics.txt
            adb shell getprop ro.build.version.release >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            adb shell getprop ro.build.version.sdk >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            adb shell getprop ro.product.model >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== Boot completion ===" >> screenshots/android-anr-diagnostics.txt
            adb shell getprop sys.boot_completed >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== Install ===" >> screenshots/android-anr-diagnostics.txt
            adb install app/build/outputs/apk/debug/app-debug.apk >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== Launch ===" >> screenshots/android-anr-diagnostics.txt
            adb shell am force-stop com.dans34.goodmorninglite >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            adb shell am start -W -n com.dans34.goodmorninglite/.MainActivity >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            sleep 12
            echo "=== App process ===" >> screenshots/android-anr-diagnostics.txt
            adb shell pidof com.dans34.goodmorninglite >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== Activity processes ===" >> screenshots/android-anr-diagnostics.txt
            adb shell dumpsys activity processes >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== Memory info ===" >> screenshots/android-anr-diagnostics.txt
            adb shell dumpsys meminfo >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== Last ANR report ===" >> screenshots/android-anr-diagnostics.txt
            adb shell dumpsys activity lastanr >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== ANR trace directory listing ===" >> screenshots/android-anr-diagnostics.txt
            adb shell ls -la /data/anr >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            echo "=== Focused ANR/system errors ===" >> screenshots/android-anr-diagnostics.txt
            adb logcat -b all -d | grep -Ei 'ANR in|not responding|system_server|FATAL EXCEPTION|am_anr|Input dispatching timed out|Watchdog|lowmemorykiller|lmkd|com\.dans34\.goodmorninglite' | tail -n 600 >> screenshots/android-anr-diagnostics.txt 2>&1 || true
            adb logcat -b all -d > screenshots/android-logcat-full.txt 2>&1 || true
            adb shell dumpsys activity > screenshots/activity-dump.txt 2>&1 || true
            adb shell dumpsys meminfo > screenshots/memory-dump.txt 2>&1 || true
            adb exec-out screencap -p > screenshots/goodmorning-lite-first-launch.png 2> screenshots/screenshot-error.txt || true
            test -s screenshots/goodmorning-lite-first-launch.png || echo "Screenshot capture failed; see screenshot-error.txt" >> screenshots/android-anr-diagnostics.txt

      - name: Upload emulator diagnostics and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-emulator-diagnostics
          path: screenshots/
          if-no-files-found: warn
