name: Android debug build and screenshot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Launch app and collect emulator diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots
            {
              echo "=== Emulator properties ==="
              adb shell getprop ro.build.version.release
              adb shell getprop ro.build.version.sdk
              adb shell getprop ro.product.model
              echo "=== Boot completion ==="
              adb shell getprop sys.boot_completed
              echo "=== Install ==="
              adb install app/build/outputs/apk/debug/app-debug.apk
              echo "=== Launch ==="
              adb shell am force-stop com.dans34.goodmorninglite
              adb shell am start -W -n com.dans34.goodmorninglite/.MainActivity
              sleep 12
              echo "=== App process ==="
              adb shell pidof com.dans34.goodmorninglite || true
              echo "=== Activity processes ==="
              adb shell dumpsys activity processes || true
              echo "=== Memory info ==="
              adb shell dumpsys meminfo || true
              echo "=== Focused ANR/system errors ==="
              adb logcat -b all -d | grep -Ei 'ANR in|not responding|system_server|FATAL EXCEPTION|am_anr|Input dispatching timed out|Watchdog|lowmemorykiller|lmkd|com\.dans34\.goodmorninglite' | tail -n 600 || true
            } > screenshots/android-anr-diagnostics.txt 2>&1
            adb logcat -b all -d > screenshots/android-logcat-full.txt 2>&1 || true
            adb shell dumpsys activity > screenshots/activity-dump.txt 2>&1 || true
            adb shell dumpsys meminfo > screenshots/memory-dump.txt 2>&1 || true
            adb exec-out screencap -p > screenshots/goodmorning-lite-first-launch.png
            test -s screenshots/goodmorning-lite-first-launch.png

      - name: Upload emulator diagnostics and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-Lite-emulator-diagnostics
          path: screenshots/
          if-no-files-found: warn
